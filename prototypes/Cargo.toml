# Phase 0 prototypes. Throwaway evidence-gathering code, not the product.
# Its own workspace root so it never joins the Phase 1 workspace.
[workspace]

[package]
name = "halftone-prototypes"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "rayon"] }
moxcms = "=0.9.2"
fast_image_resize = { version = "=6.1.0", features = ["rayon"] }
rayon = "=1.12.0"
i_overlay = { version = "=9.2.0", features = ["allow_multithreading"] }
resvg = { version = "=0.50.0", default-features = false }

[profile.release]
debug = 1
