# cargo deny check: licenses must be MIT-compatible (project is MIT).
[graph]
all-features = false

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "NCSA",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[advisories]
yanked = "deny"

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
